<div class="container">
  <p-card>
    <h2>Jogadores</h2>

    <div class="add">
      <input pInputText placeholder="Nome" [(ngModel)]="nomeNovoJogador" />
      <p-inputNumber [(ngModel)]="saldoInicialNovoJogador" [min]="1" [showButtons]="true" />
      <p-button label="Adicionar" (onClick)="adicionarJogador()"></p-button>
    </div>

    <p-table [value]="jogadores()">
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>Fichas</th>
          <th>Valor (R$)</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-j>
        <tr>
          <td>{{ j.nome }}</td>
          <td>{{ j.saldo }}</td>
          <td>{{ j.saldo * (configuracao?.valorFicha || 0) | currency:'BRL' }}</td>
          <td><button (click)="removerJogador(j.id)">Remover</button></td>
        </tr>
      </ng-template>
    </p-table>

    <div class="footer">
      <p-button label="Voltar" (onClick)="voltar()" severity="secondary" [outlined]="true"></p-button>
      <p-button label="Próximo" (onClick)="proximo()" [disabled]="jogadores().length < 2"></p-button>
    </div>
  </p-card>
</div>
